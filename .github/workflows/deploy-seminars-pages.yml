name: Deploy engineering seminars to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "ai-agent-harness-seminar/**"
      - "persistent-work-agents-seminar/**"
      - "saif-2026-seminar/**"
      - ".github/pages/**"
      - ".github/workflows/deploy-seminars-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ai-agent-harness-seminar/package-lock.json
            persistent-work-agents-seminar/package-lock.json

      - name: Reset Pages staging directory
        run: rm -rf _pages

      - name: Install harness seminar dependencies
        working-directory: ai-agent-harness-seminar
        run: npm ci

      - name: Validate harness seminar project
        working-directory: ai-agent-harness-seminar
        run: npm run validate

      - name: Build harness seminar into Pages staging
        working-directory: ai-agent-harness-seminar
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/ai-agent-harness-seminar/
        run: npm run build:pages

      - name: Install persistent agents seminar dependencies
        working-directory: persistent-work-agents-seminar
        run: npm ci

      - name: Validate persistent agents seminar project
        working-directory: persistent-work-agents-seminar
        run: npm run validate

      - name: Build persistent agents seminar into Pages staging
        working-directory: persistent-work-agents-seminar
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/persistent-work-agents-seminar/
        run: npm run build:pages

      - name: Validate and stage SAIF 2026 web seminar
        run: |
          node saif-2026-seminar/validate.mjs
          mkdir -p _pages/saif-2026-seminar
          cp saif-2026-seminar/index.html _pages/saif-2026-seminar/index.html

      - name: Check Pages staging output
        run: |
          test -f _pages/index.html
          test -f _pages/404.html
          test -f _pages/ai-agent-harness-seminar/index.html
          test -f _pages/persistent-work-agents-seminar/index.html
          test -f _pages/saif-2026-seminar/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
